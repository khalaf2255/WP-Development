  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      
      --accent: #10b981;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --vscode-bg: #1e1e1e;
      --vscode-header: #2d2d2d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding-bottom: 60px;
    }

    /* Top Bar Header */
    .top-nav {
      background: #0f172a;
      color: #ffffff;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .top-nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 17px;
      color: #ffffff;
      text-decoration: none;
    }
    .top-nav-brand span {
      background: var(--primary);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    .nav-btn {
      background: rgba(255,255,255,0.1);
      color: #ffffff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: var(--primary); }

    /* Main Container */
    .container {
      max-width: 980px;
      margin: 40px auto;
      background: var(--card-bg);
      padding: 48px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
    }

    /* Lesson Header */
    .lesson-header {
      border-bottom: 2px dashed var(--border);
      padding-bottom: 24px;
      margin-bottom: 28px;
    }
    .lesson-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .lesson-title {
      font-size: 32px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    px solid #334155;

      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      transition: all 0.3s;
      font-family: 'Tajawal', sans-serif;

      color: #ffffff;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    /* Creator Box Content */
      display: none;
      background: #fff5f5;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 36px;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.08);
    }
    .yt-box-title {
      color: #991b1b;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .yt-section-card {
      background: #ffffff;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .yt-section-card h4 {
      color: #7f1d1d;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .yt-copy-text {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #334155;
      margin-top: 8px;
      position: relative;
    }
    .yt-copy-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #475569;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
    }

    /* Section titles */
    h2.section-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin: 40px 0 20px;
      padding-right: 14px;
      border-right: 5px solid var(--primary);
    }

    h3.subsection-title {
      font-size: 19px;
      font-weight: 700;
      color: #1e293b;
      margin: 28px 0 14px;
    }

    p { margin-bottom: 16px; color: #334155; font-size: 16.5px; }
    ul, ol { margin-bottom: 20px; padding-right: 24px; }
    li { margin-bottom: 8px; color: #334155; font-size: 16px; }

    .info-box {
      background: #f0f9ff;
      border-right: 4px solid var(--primary);
      padding: 20px 24px;
      border-radius: 12px;
      margin: 24px 0;
    }
    .warning-box {
      background: #fff1f2;
      border-right: 4px solid #f43f5e;
      padding: 20px 24px;
      border-radius: 12px;
      margin: 24px 0;
    }
    .tip-box {
      background: #ecfdf5;
      border-right: 4px solid var(--accent);
      padding: 20px 24px;
      border-radius: 12px;
      margin: 24px 0;
    }

    /* VS Code Code Block */
    .vscode-container {
      background-color: var(--vscode-bg);
      border-radius: 12px;
      overflow: hidden;
      margin: 28px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      direction: ltr;
      font-family: 'Fira Code', Consolas, Monaco, monospace;
    }
    .vscode-header {
      background-color: var(--vscode-header);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3c3c3c;
    }
    .vscode-controls { display: flex; align-items: center; gap: 8px; }
    .vscode-dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }
    
    .vscode-file-tab {
      color: #cccccc;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }
    .vscode-lang {
      background: #007acc;
      color: #ffffff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .copy-btn {
      background: #3a3d41;
      color: #ffffff;
      border: 1px solid #555555;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: 'Tajawal', sans-serif;
      direction: rtl;
    }
    .copy-btn:hover { background: #4e5257; border-color: #007acc; }
    .copy-btn.copied { background: #10b981; border-color: #10b981; }

    .vscode-code-area {
      padding: 20px;
      overflow-x: auto;
      color: #d4d4d4;
      font-size: 14.5px;
      line-height: 1.6;
      white-space: pre;
    }

    .token-keyword { color: #569cd6; font-weight: bold; }
    .token-string { color: #ce9178; }
    .token-comment { color: #6a9955; font-style: italic; }
    .token-function { color: #dcdcaa; }
    .token-variable { color: #9cdcfe; }

    /* Tables */
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      margin: 28px 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .custom-table th {
      background: #0f172a;
      color: #ffffff;
      padding: 14px 18px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }
    .custom-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      color: #334155;
    }
    .custom-table tr:nth-child(even) { background-color: #f8fafc; }

    /* Review Questions Card */
    .qa-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .qa-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      border-color: var(--primary);
    }
    .qa-question {
      font-weight: 700;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .qa-answer {
      background: #f1f5f9;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      color: #1e293b;
      border-right: 3px solid var(--accent);
    }

    /* Cheatsheet Box */
    .cheatsheet-card {
      background: #fdf4ff;
      border: 2px solid #f0abfc;
      border-radius: 14px;
      padding: 24px;
      margin: 32px 0;
    }
    .cheatsheet-card h3 {
      color: #86198f;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .cheatsheet-card ul {
      list-style-type: none;
      padding-right: 0;
    }
    .cheatsheet-card li {
      position: relative;
      padding-right: 24px;
      margin-bottom: 10px;
      font-weight: 600;
      color: #701a75;
    }
    .cheatsheet-card li::before {
      content: "⚡";
      position: absolute;
      right: 0;
      top: 0;
    }

    /* Bottom Navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 50px;
      padding-top: 28px;
      border-top: 2px solid var(--border);
    }
    .bottom-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: #f1f5f9;
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      transition: all 0.2s;
    }
    .bottom-nav-btn:hover { background: var(--primary); color: #ffffff; }
  </style>
